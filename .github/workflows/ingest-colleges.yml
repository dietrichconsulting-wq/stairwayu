name: Monthly college ingest

# Replaces the Vercel cron for /api/cron/ingest-colleges. Running the script
# here removes Vercel's 5-minute function ceiling (the ingest can take longer
# once program-level data is included) and works on any Vercel plan.
#
# Required repo secrets:
#   COLLEGE_SCORECARD_API_KEY
#   NEXT_PUBLIC_SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY

on:
  schedule:
    - cron: '0 4 1 * *' # 04:00 UTC on the 1st of each month (same as old Vercel cron)
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run ingest
        env:
          COLLEGE_SCORECARD_API_KEY: ${{ secrets.COLLEGE_SCORECARD_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ingest-colleges.mjs
